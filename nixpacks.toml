[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "gcc"]
nixLibs = ["gcc-unwrapped"]

[phases.install]
cmds = [
  "cd backend && python -m venv --copies /opt/venv",
  "cd backend && /opt/venv/bin/pip install -r requirements.txt"
]

[start]
cmd = "cd backend && /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
