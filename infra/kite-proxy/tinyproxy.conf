## AlphaVyuh Kite order proxy — tinyproxy config
## Only allows CONNECT/forward to api.kite.trade

Port 8888
Listen 0.0.0.0
Timeout 30
MaxClients 50

# Allow connections from any source (Railway backend, local dev)
# Auth is handled by keeping the proxy URL secret (env var)
Allow 0.0.0.0/0

# Only allow proxying to Kite API
ConnectPort 443
ConnectPort 80
Filter "/etc/tinyproxy/filter.txt"
FilterDefaultDeny Yes

LogLevel Info
