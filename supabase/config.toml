# Supabase local dev config.
# Required by the CLI for `db push`, `db reset`, `db types`, and `start`.
# Update `project_id` to match your production project ref
# (found in Supabase dashboard → Settings → General → Reference ID).

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://localhost:3000", "https://www.alphavyuh.com/auth/callback", "https://alphavyuh.com/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your AlphaVyuh account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your AlphaVyuh password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Sign in to AlphaVyuh"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.invite]
subject = "Your AlphaVyuh invite"
content_path = "./supabase/templates/invite.html"

[analytics]
enabled = false

# Production project reference (update once you have it)
# project_id = "your-prod-project-ref"
