<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your AlphaVyuh invite</title>
  </head>
  <body style="margin:0;background:#050807;color:#f4f7fb;font-family:Inter,Arial,sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:32px 20px;">
      <div style="padding:24px;border:1px solid #1f2a2a;border-radius:16px;background:#0b1110;">
        <div style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#8cf0e1;">AlphaVyuh</div>
        <h1 style="margin:14px 0 10px;font-size:26px;line-height:1.15;color:#f4f7fb;">Your invite is ready</h1>
        <p style="margin:0 0 18px;font-size:15px;line-height:1.65;color:#b8c3c7;">
          You have been invited to create an AlphaVyuh account and access the founder beta workspace.
        </p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 18px;border-radius:10px;background:#8cf0e1;color:#061110;text-decoration:none;font-size:14px;font-weight:800;">
          Accept invite
        </a>
        <p style="margin:20px 0 0;font-size:12px;line-height:1.6;color:#809096;">
          This invite is intended for {{ .Email }}. Do not forward it.
        </p>
      </div>
    </div>
  </body>
</html>
