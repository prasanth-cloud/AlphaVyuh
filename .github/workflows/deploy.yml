name: Deploy to Vercel

# Vercel's native GitHub integration handles production deploys automatically
# when code is pushed to main. This workflow is intentionally disabled to
# prevent duplicate deployments competing for the production slot.
#
# Root cause: having both this workflow AND Vercel's git integration caused
# two simultaneous production deployments per push — one always failed.
# Fix: set rootDirectory=frontend on the Vercel project + use native integration only.

on:
  workflow_dispatch:  # manual trigger only — kept for emergency use
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
