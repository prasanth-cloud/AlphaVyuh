name: Deploy to Vercel

# Emergency manual deploy — used when Vercel's native GitHub integration
# can't pick up an env var change without a new commit.
#
# Root cause of rootDirectory trap: Vercel project has rootDirectory=frontend.
# Running vercel CLI from working-directory: frontend makes it look for
# frontend/frontend (double-path). Fix: copy .vercel/ to repo root and run
# all vercel commands from the repo root; Vercel then resolves rootDirectory=frontend
# relative to the repo root correctly.

on:
  workflow_dispatch:  # manual trigger only — kept for emergency use
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull env into frontend/ (where .vercel/project.json lives)
      - name: Pull Vercel env
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Copy .vercel config to repo root so build+deploy run from root.
      # This fixes the rootDirectory=frontend double-path issue: running from
      # the repo root with rootDirectory=frontend correctly resolves to frontend/.
      - name: Copy .vercel config to repo root
        run: cp -r frontend/.vercel ./

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
