name: Railway Backend Recovery

on:
  workflow_dispatch:
    inputs:
      production_api_url:
        description: Production API base URL to verify
        required: true
        default: https://alphavyuh-production.up.railway.app
      railway_project_id:
        description: Railway project ID to link in CI. Optional when RAILWAY_PROJECT_ID secret is set.
        required: false
      railway_environment:
        description: Railway environment
        required: true
        default: production
      railway_service:
        description: Railway backend service name or ID. Optional when RAILWAY_SERVICE secret is set.
        required: false
      railway_workspace:
        description: Railway workspace/team ID or slug. Optional when RAILWAY_WORKSPACE secret is set.
        required: false
      production_api_chart_symbols:
        description: Comma-separated chart symbols for recovery smoke. Optional when PRODUCTION_API_CHART_SYMBOLS secret is set.
        required: false
      live_url:
        description: Public frontend URL for signed-in browser smoke
        required: true
        default: https://www.alphavyuh.com

permissions:
  contents: read

jobs:
  recover:
    name: Recover Railway backend and verify production API
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install Playwright Chromium
        run: npm --prefix frontend exec playwright install --with-deps chromium

      - name: Validate Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing RAILWAY_TOKEN repository secret."
            echo "Create a Railway token, add it to GitHub Actions secrets as RAILWAY_TOKEN, then rerun this workflow."
            exit 1
          fi

      - name: Validate full recovery smoke credentials
        env:
          PRODUCTION_API_BEARER_TOKEN: ${{ secrets.PRODUCTION_API_BEARER_TOKEN }}
          PLAYWRIGHT_QA_EMAIL: ${{ secrets.PLAYWRIGHT_QA_EMAIL }}
          PLAYWRIGHT_QA_PASSWORD: ${{ secrets.PLAYWRIGHT_QA_PASSWORD }}
        run: npm run check:production-smoke-env

      - name: Recover backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ github.event.inputs.railway_project_id || secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ github.event.inputs.railway_environment }}
          RAILWAY_SERVICE: ${{ github.event.inputs.railway_service || secrets.RAILWAY_SERVICE }}
          RAILWAY_WORKSPACE: ${{ github.event.inputs.railway_workspace || secrets.RAILWAY_WORKSPACE }}
          PRODUCTION_API_URL: ${{ github.event.inputs.production_api_url }}
          PRODUCTION_API_BEARER_TOKEN: ${{ secrets.PRODUCTION_API_BEARER_TOKEN }}
          PLAYWRIGHT_QA_EMAIL: ${{ secrets.PLAYWRIGHT_QA_EMAIL }}
          PLAYWRIGHT_QA_PASSWORD: ${{ secrets.PLAYWRIGHT_QA_PASSWORD }}
          PRODUCTION_API_CHART_SYMBOLS: ${{ github.event.inputs.production_api_chart_symbols || secrets.PRODUCTION_API_CHART_SYMBOLS }}
        run: npm run recover:railway-backend

      - name: Strict production data recovery preflight
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ github.event.inputs.railway_project_id || secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ github.event.inputs.railway_environment }}
          RAILWAY_SERVICE: ${{ github.event.inputs.railway_service || secrets.RAILWAY_SERVICE }}
          RAILWAY_WORKSPACE: ${{ github.event.inputs.railway_workspace || secrets.RAILWAY_WORKSPACE }}
          PRODUCTION_API_URL: ${{ github.event.inputs.production_api_url }}
          PRODUCTION_API_BEARER_TOKEN: ${{ secrets.PRODUCTION_API_BEARER_TOKEN }}
          PRODUCTION_API_CHART_SYMBOLS: ${{ github.event.inputs.production_api_chart_symbols || secrets.PRODUCTION_API_CHART_SYMBOLS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRE_AUTHENTICATED_SMOKE: "1"
        run: npm run check:data-recovery

      - name: Strict signed-in production browser smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.live_url }}
          PLAYWRIGHT_EXPECT_REAL_DATA: "true"
          PLAYWRIGHT_QA_EMAIL: ${{ secrets.PLAYWRIGHT_QA_EMAIL }}
          PLAYWRIGHT_QA_PASSWORD: ${{ secrets.PLAYWRIGHT_QA_PASSWORD }}
          PLAYWRIGHT_SMOKE_SYMBOL: RELIANCE
        run: npm --prefix frontend exec -- playwright test --config=frontend/playwright.local.config.ts frontend/tests/e2e/smoke-signed-in.spec.ts
