name: Railway Backend Recovery

on:
  workflow_dispatch:
    inputs:
      production_api_url:
        description: Production API base URL to verify
        required: true
        default: https://alphavyuh-production.up.railway.app
      production_api_chart_symbols:
        description: Comma-separated chart symbols for recovery smoke. Optional when PRODUCTION_API_CHART_SYMBOLS secret is set.
        required: false
      live_url:
        description: Public frontend URL for signed-in browser smoke
        required: true
        default: https://www.alphavyuh.com

permissions:
  contents: read

jobs:
  recover:
    name: Recover Railway backend and verify production API
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.66.1

      - name: Install Vercel CLI
        run: npm install -g vercel@54.7.1

      - name: Install Playwright Chromium
        run: npm --prefix frontend exec playwright install --with-deps chromium

      - name: Validate trusted production targets
        env:
          PRODUCTION_API_URL_INPUT: ${{ github.event.inputs.production_api_url }}
          LIVE_URL_INPUT: ${{ github.event.inputs.live_url }}
          REQUIRE_LIVE_URL: "1"
        run: node scripts/validate-production-workflow-targets.mjs

      - name: Prepare production smoke account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_QA_EMAIL: ${{ secrets.PLAYWRIGHT_QA_EMAIL }}
          PLAYWRIGHT_QA_EMAIL_UNIQUE_PER_RUN: "1"
        run: node scripts/prepare-production-smoke-account.mjs

      - name: Validate Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing RAILWAY_TOKEN repository secret."
            echo "Create a Railway token, add it to GitHub Actions secrets as RAILWAY_TOKEN, then rerun this workflow."
            exit 1
          fi

      - name: Validate full recovery smoke credentials
        run: npm run check:production-smoke-env

      - name: Recover backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: production
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_WORKSPACE: ${{ secrets.RAILWAY_WORKSPACE }}
          PRODUCTION_API_CHART_SYMBOLS: ${{ github.event.inputs.production_api_chart_symbols || secrets.PRODUCTION_API_CHART_SYMBOLS }}
        run: npm run recover:railway-backend

      - name: Strict production data recovery preflight
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: production
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_WORKSPACE: ${{ secrets.RAILWAY_WORKSPACE }}
          PRODUCTION_API_CHART_SYMBOLS: ${{ github.event.inputs.production_api_chart_symbols || secrets.PRODUCTION_API_CHART_SYMBOLS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRE_AUTHENTICATED_SMOKE: "1"
        run: npm run check:data-recovery

      - name: Strict signed-in production browser smoke
        env:
          PLAYWRIGHT_EXPECT_REAL_DATA: "true"
          PLAYWRIGHT_SMOKE_SYMBOL: RELIANCE
        run: npm --prefix frontend exec -- playwright test --config=frontend/playwright.local.config.ts frontend/tests/e2e/smoke-signed-in.spec.ts
