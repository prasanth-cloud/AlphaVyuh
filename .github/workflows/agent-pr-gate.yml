name: Agent PR Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-pr-gate:
    name: Agent regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DATA_MODE: mock
      NEXT_PUBLIC_ALLOW_MOCK_FALLBACK: "true"
      NEXT_PUBLIC_FORCE_LIVE_DATA: "false"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_JWT_SECRET: playwright-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install frontend dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pip-audit

      - name: Install Playwright Chromium
        run: npm --prefix frontend exec playwright install --with-deps chromium

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm run test

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Production API checker tests
        run: npm run test:production-api-check

      - name: Production smoke account identity tests
        run: npm run test:production-smoke-account-identity

      - name: Scanner benchmark checker tests
        run: npm run test:scanner-benchmark

      - name: Scanner benchmark workflow checker tests
        run: npm run test:scanner-benchmark-workflow-check

      - name: Five-year chart contract tests
        run: npm run test:five-year-chart-check

      - name: Production smoke env checker tests
        run: npm run test:production-smoke-env-check

      - name: Production smoke workflow checker tests
        run: npm run test:production-smoke-workflow-check

      - name: Railway recovery workflow checker tests
        run: npm run test:railway-recovery-workflow-check

      - name: Railway recovery script tests
        run: npm run test:railway-recovery-script

      - name: Recovery handoff credential checker tests
        run: npm run test:recovery-handoff-credentials-check

      - name: Signed-in copy posture checker tests
        run: npm run test:signed-in-copy-posture-check

      - name: Public posture checker tests
        run: npm run test:public-posture-check

      - name: Data recovery readiness checker tests
        run: npm run test:data-recovery-check

      - name: Market-data entitlement contract tests
        run: npm run test:market-data-entitlement-check

      - name: Setup review workflow contract tests
        run: npm run test:setup-review-check

      - name: Sector taxonomy checker tests
        run: npm run test:sector-taxonomy-check

      - name: Broker read-only contract tests
        run: npm run test:broker-readonly-check

      - name: Railway secret prep checker tests
        run: npm run test:railway-secret-prep

      - name: CI action runtime checker tests
        run: npm run test:ci-action-runtime-check

      - name: Signed-in workflow browser smoke
        run: npm run test:e2e:smoke

      - name: Release readiness browser smoke
        run: npm run test:e2e:release

      - name: Capture integrated visual evidence
        run: npm --prefix frontend exec -- playwright test --config=frontend/playwright.mock.config.ts frontend/tests/e2e/integration-visual-evidence.spec.ts

      - name: Upload integrated visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: alphavyuh-integrated-visual-evidence-${{ github.event.pull_request.number || github.run_id }}
          path: frontend/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Backend tests
        run: python -m pytest backend/tests

      - name: Backend dependency audit
        run: python -m pip_audit -r backend/requirements.txt --disable-pip --no-deps --progress-spinner off
