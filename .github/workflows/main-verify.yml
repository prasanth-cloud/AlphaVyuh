name: Main Verify

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DATA_MODE: mock
      NEXT_PUBLIC_ALLOW_MOCK_FALLBACK: "true"
      NEXT_PUBLIC_FORCE_LIVE_DATA: "false"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_JWT_SECRET: playwright-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Install Playwright Chromium
        run: npm --prefix frontend exec playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Mock workflow browser smoke
        run: npm run test:e2e:mock

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Scanner, alerts, and broker tests
        run: |
          python -m pytest \
            backend/tests/test_scanner_filters.py \
            backend/tests/test_scanner_intelligence.py \
            backend/tests/test_scanner_outage_status.py \
            backend/tests/test_vcp.py \
            backend/tests/test_scan_alerts.py \
            backend/tests/test_daily_refresh_alerts.py \
            backend/tests/test_price_alerts_outage_status.py \
            backend/tests/test_broker_order_safety.py \
            backend/tests/test_broker_encrypted_credentials.py \
            backend/tests/test_brokers_router.py \
            backend/tests/test_kite_adapter.py \
            backend/tests/test_upstox_adapter.py
