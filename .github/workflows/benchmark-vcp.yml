name: VCP Latency Benchmark

# Production-representative benchmark for the all-NSE VCP scan latency.
# Runs from GitHub's Azure East US infrastructure (~10-20ms RTT to Supabase
# us-east-2) vs. the Mac → trans-Pacific baseline (~130ms RTT).
#
# Trigger manually three times at different times of day:
#   gh workflow run benchmark-vcp.yml -f run_label=morning -f iterations=50
#   gh workflow run benchmark-vcp.yml -f run_label=afternoon -f iterations=50
#   gh workflow run benchmark-vcp.yml -f run_label=evening -f iterations=50
#
# See: docs/benchmarks/m3-production-env.md, ADR 005 §Post-fix observations

on:
  workflow_dispatch:
    inputs:
      run_label:
        description: 'Label for this run (morning / afternoon / evening / run1 etc.)'
        required: true
        default: 'run1'
      iterations:
        description: 'Benchmark iterations per scan'
        required: false
        default: '50'
      trade_date:
        description: 'Trade date override (YYYY-MM-DD, leave blank for auto)'
        required: false
        default: ''

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run benchmark (with RTT probe)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_LABEL: ${{ github.event.inputs.run_label || 'run1' }}
          BENCHMARK_ITERATIONS: ${{ github.event.inputs.iterations || '50' }}
          TRADE_DATE: ${{ github.event.inputs.trade_date || '' }}
        run: |
          set -euo pipefail

          if [[ ! "$RUN_LABEL" =~ ^[A-Za-z0-9._-]{1,40}$ ]]; then
            echo "Invalid run_label. Use 1-40 letters, numbers, dots, underscores, or hyphens." >&2
            exit 1
          fi
          if [[ ! "$BENCHMARK_ITERATIONS" =~ ^[0-9]+$ ]] || [ "$BENCHMARK_ITERATIONS" -lt 1 ] || [ "$BENCHMARK_ITERATIONS" -gt 200 ]; then
            echo "Invalid iterations. Use an integer between 1 and 200." >&2
            exit 1
          fi
          if [ -n "$TRADE_DATE" ] && [[ ! "$TRADE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid trade_date. Use YYYY-MM-DD." >&2
            exit 1
          fi

          OUT="/tmp/bench-${GITHUB_RUN_ID:-manual}.txt"

          # Header
          tee "$OUT" <<HEADER
          === VCP Latency Benchmark — $RUN_LABEL ===
          Run ID    : ${{ github.run_id }}
          Runner OS : $(uname -srm)
          UTC time  : $(date -u)
          Iterations: $BENCHMARK_ITERATIONS
          HEADER

          # Network probe — measure RTT from runner to Supabase
          SUPABASE_HOST=$(echo "$SUPABASE_URL" | sed 's|https://||' | sed 's|/.*||')
          PUBLIC_IP=$(curl -sf --max-time 5 https://api.ipify.org 2>/dev/null || echo "unavailable")

          {
            echo ""
            echo "--- Network probe ---"
            echo "Runner public IP : $PUBLIC_IP"
            echo "Supabase host    : $SUPABASE_HOST"
            echo ""
            echo "RTT samples (curl -w %{time_connect}, 5 attempts):"
            for i in 1 2 3 4 5; do
              curl -sS -o /dev/null \
                -w "  sample $i: connect=%{time_connect}s  ttfb=%{time_starttransfer}s\n" \
                --max-time 10 \
                "https://$SUPABASE_HOST/rest/v1/" \
                -H "apikey: probe" 2>/dev/null \
              || echo "  sample $i: failed"
            done
            echo ""
            echo "--- Benchmark ---"
          } | tee -a "$OUT"

          args=(--iterations "$BENCHMARK_ITERATIONS")
          if [ -n "$TRADE_DATE" ]; then
            args+=(--trade-date "$TRADE_DATE")
          fi

          cd backend
          python scripts/bench_scanner.py "${args[@]}" 2>&1 | tee -a "$OUT"

          echo "" | tee -a "$OUT"
          echo "Finished: $(date -u)" | tee -a "$OUT"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.run_id }}
          path: /tmp/bench-${{ github.run_id }}.txt
          retention-days: 30
