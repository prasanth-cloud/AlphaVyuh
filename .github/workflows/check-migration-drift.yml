name: Migration Drift Check

# Runs on every PR so the branch-protection-required status is always emitted.
# It only enforces migration evidence when supabase/migrations/ changes.
# This is a FORCING FUNCTION — not an automated pipeline.
# Migrations are never auto-applied. The check enforces the human process:
#   1. Apply to staging → 2. Apply to prod → 3. Document in PR description
#
# To PASS this check after applying migrations:
#   1. Supabase API must show the added migration versions applied to prod.
#   2. Add  <!-- migration-applied-to-prod -->  anywhere in the PR description.
#
# Required repo setup (one-time, by repo admin):
#   1. Add SUPABASE_ACCESS_TOKEN to repo secrets:
#      Supabase dashboard → Account → Access tokens → Generate new token
#      GitHub: Settings → Secrets and variables → Actions → New repository secret
#   2. Add "Migration drift check" to branch protection required status checks:
#      GitHub: Settings → Branches → [main] → Require status checks → search "Migration drift check"
#      Without step 2, the check shows red but does NOT block merge.

on:
  pull_request:

jobs:
  check-drift:
    name: Migration drift check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ── Step 1: Detect what changed in supabase/migrations/ ──────────────────
      - name: Detect migration changes
        id: detect
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1

          ADDED=$(git diff --name-only --diff-filter=A \
            origin/${{ github.base_ref }}...HEAD -- 'supabase/migrations/*.sql')

          # MR: M = modified content, R = renamed (git mv counts as rename, not modify)
          MODIFIED=$(git diff --name-only --diff-filter=MR \
            origin/${{ github.base_ref }}...HEAD -- 'supabase/migrations/*.sql')

          # Strip full paths to filenames only
          ADDED_NAMES=$(echo "$ADDED" | xargs -I{} basename {} 2>/dev/null | tr '\n' ' ' || true)
          MODIFIED_NAMES=$(echo "$MODIFIED" | xargs -I{} basename {} 2>/dev/null | tr '\n' ' ' || true)

          echo "has_new=$([ -n "$(echo $ADDED | tr -d ' ')" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_modified=$([ -n "$(echo $MODIFIED | tr -d ' ')" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          {
            echo "added_files<<HEREDOC"
            echo "$ADDED_NAMES"
            echo "HEREDOC"
          } >> $GITHUB_OUTPUT
          {
            echo "modified_files<<HEREDOC"
            echo "$MODIFIED_NAMES"
            echo "HEREDOC"
          } >> $GITHUB_OUTPUT

          echo "=== Added ==="
          echo "$ADDED_NAMES"
          echo "=== Modified/Renamed ==="
          echo "$MODIFIED_NAMES"

      # ── Step 2: Get prod migration count ─────────────────────────────────────
      # Excludes *_stub.sql files from local count — stubs document prod-only
      # migrations and are never applied; including them inflates the count.
      - name: Get prod migration count
        id: counts
        if: steps.detect.outputs.has_new == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          # Exclude stub files — they have no executable SQL and are not applied
          LOCAL=$(find supabase/migrations -name '*.sql' ! -name '*_stub.sql' | wc -l | tr -d ' ')
          echo "local_count=$LOCAL" >> $GITHUB_OUTPUT

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "remote_count=unknown (add SUPABASE_ACCESS_TOKEN secret)" >> $GITHUB_OUTPUT
            echo "remote_reason=missing-token" >> $GITHUB_OUTPUT
            echo "SUPABASE_ACCESS_TOKEN not set — skipping remote count"
          elif [[ "$SUPABASE_URL" =~ ^https://([a-z0-9]+)\.supabase\.co/?$ ]]; then
            PROJECT_REF="${BASH_REMATCH[1]}"
            HTTP_CODE=$(curl -s -o /tmp/migrations_resp.json -w "%{http_code}" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/migrations")
            if [ "$HTTP_CODE" = "200" ]; then
              REMOTE=$(jq 'length' /tmp/migrations_resp.json 2>/dev/null || echo "parse-error")
              echo "remote_count=$REMOTE" >> $GITHUB_OUTPUT
              echo "remote_reason=ok" >> $GITHUB_OUTPUT
              {
                echo "remote_versions<<HEREDOC"
                jq -r '.[] | (.version // .name // .migration_version // .id // empty)' /tmp/migrations_resp.json 2>/dev/null || true
                echo "HEREDOC"
              } >> $GITHUB_OUTPUT
              echo "Prod applied: $REMOTE | Local files (excl. stubs): $LOCAL"
            elif [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              echo "remote_count=auth-error (check SUPABASE_ACCESS_TOKEN value)" >> $GITHUB_OUTPUT
              echo "remote_reason=auth" >> $GITHUB_OUTPUT
              echo "$HTTP_CODE Unauthorized — SUPABASE_ACCESS_TOKEN may be expired or lacks access to project $PROJECT_REF"
            elif [ "$HTTP_CODE" = "404" ]; then
              echo "remote_count=project-not-found (check SUPABASE_URL project ref)" >> $GITHUB_OUTPUT
              echo "remote_reason=project-not-found" >> $GITHUB_OUTPUT
              echo "Supabase project $PROJECT_REF was not found or is not visible to SUPABASE_ACCESS_TOKEN"
            elif [ "$HTTP_CODE" = "000" ]; then
              echo "remote_count=network-error (Supabase Management API unreachable)" >> $GITHUB_OUTPUT
              echo "remote_reason=network" >> $GITHUB_OUTPUT
              echo "Supabase Management API request could not connect"
            else
              echo "remote_count=api-error ($HTTP_CODE)" >> $GITHUB_OUTPUT
              echo "remote_reason=api" >> $GITHUB_OUTPUT
              echo "Supabase API returned HTTP $HTTP_CODE"
            fi
          else
            echo "remote_count=invalid-url (set SUPABASE_URL to https://<project-ref>.supabase.co)" >> $GITHUB_OUTPUT
            echo "remote_reason=invalid-url" >> $GITHUB_OUTPUT
            echo "SUPABASE_URL is missing or does not match the expected Supabase project URL format"
          fi

      # ── Step 3: Block modifications/renames of existing migrations ───────────
      - name: Block modified/renamed migrations (append-only rule)
        if: steps.detect.outputs.has_modified == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const files = `${{ steps.detect.outputs.modified_files }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## ❌ Migration drift check — append-only violation`,
                ``,
                `**Migrations are append-only.** This PR modifies or renames existing migration files:`,
                `\`\`\``,
                files,
                `\`\`\``,
                ``,
                `To change applied schema: create a new migration file that ALTERs or DROPs.`,
                `Never edit or rename a migration that has been applied to any environment.`,
              ].join('\n'),
            });
            core.setFailed('Modified/renamed existing migration files — append-only rule violated.');

      # ── Step 4: Post checklist comment for new migrations ────────────────────
      - name: Post migration checklist
        if: steps.detect.outputs.has_new == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const added   = `${{ steps.detect.outputs.added_files }}`.trim();
            const remote  = `${{ steps.counts.outputs.remote_count }}`;
            const local   = `${{ steps.counts.outputs.local_count }}`;

            // Avoid duplicate comments on re-push — match specifically on the bot login
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const BOT_LOGIN = 'github-actions[bot]';
            const existing = comments.data.find(c =>
              c.user.login === BOT_LOGIN && c.body.includes('Migration drift check')
            );

            const body = [
              `## ⚠️ Migration drift check — apply before merging`,
              ``,
              `This PR adds migration files that **must be applied to staging and prod** before merging.`,
              ``,
              `| | Count |`,
              `|---|---|`,
              `| Prod applied | ${remote} |`,
              `| Local files (excl. stubs) | ${local} |`,
              ``,
              `**New migrations in this PR:**`,
              `\`\`\``,
              added,
              `\`\`\``,
              ``,
              `**Required steps — paste terminal output below each item:**`,
              ``,
              `- [ ] Applied to staging: \`bun run db:push:staging\``,
              `\`\`\``,
              `# paste staging output here`,
              `\`\`\``,
              `- [ ] Applied to prod: \`supabase db push --linked\` (only after staging verified)`,
              `\`\`\``,
              `# paste prod output here`,
              `\`\`\``,
              `- [ ] Schema verified on prod via Supabase MCP or dashboard`,
              ``,
              `---`,
              `**To pass this check:** apply the listed migration versions to prod, then add the following marker to the PR description (not a comment):`,
              `\`<!-- migration-applied-to-prod -->\``,
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ── Step 5: Fail until evidence is in PR description ─────────────────────
      - name: Require migration evidence in PR description
        if: steps.detect.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDED_FILES: ${{ steps.detect.outputs.added_files }}
          LOCAL_COUNT: ${{ steps.counts.outputs.local_count }}
          REMOTE_COUNT: ${{ steps.counts.outputs.remote_count }}
          REMOTE_REASON: ${{ steps.counts.outputs.remote_reason }}
          REMOTE_VERSIONS: ${{ steps.counts.outputs.remote_versions }}
        run: |
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} \
            --json body -q .body 2>/dev/null || echo "")

          if ! [[ "$LOCAL_COUNT" =~ ^[0-9]+$ && "$REMOTE_COUNT" =~ ^[0-9]+$ ]]; then
            echo ""
            echo "✗ Migration check failed."
            echo ""
            echo "  Could not verify production migration state through the Supabase API."
            echo "  Local count:  ${LOCAL_COUNT:-unknown}"
            echo "  Remote count: ${REMOTE_COUNT:-unknown}"
            echo "  Remote reason: ${REMOTE_REASON:-unknown}"
            echo "  Configure SUPABASE_ACCESS_TOKEN and rerun after applying migrations."
            echo ""
            exit 1
          fi

          if [ "$REMOTE_COUNT" -lt "$LOCAL_COUNT" ]; then
            echo ""
            echo "✗ Migration check failed."
            echo ""
            echo "  Production has fewer applied migrations than this branch."
            echo "  Prod applied: $REMOTE_COUNT"
            echo "  Local files:  $LOCAL_COUNT"
            echo ""
            exit 1
          fi

          missing_versions=""
          for file in $ADDED_FILES; do
            version="${file%%_*}"
            name="${file%.sql}"
            if ! printf '%s\n' "$REMOTE_VERSIONS" | grep -Fxq "$version" \
              && ! printf '%s\n' "$REMOTE_VERSIONS" | grep -Fxq "$name"; then
              missing_versions="${missing_versions}${file} "
            fi
          done

          if [ -n "$missing_versions" ]; then
            echo ""
            echo "✗ Migration check failed."
            echo ""
            echo "  Added migration versions were not found in production Supabase migration history:"
            echo "  $missing_versions"
            echo ""
            exit 1
          fi

          if ! echo "$PR_BODY" | grep -q "migration-applied-to-prod"; then
            echo ""
            echo "✗ Migration check failed."
            echo ""
            echo "  New migration files were added but no prod application evidence found."
            echo "  Steps:"
            echo "    1. Apply to staging:  bun run db:push:staging"
            echo "    2. Apply to prod:     supabase db push --linked"
            echo "    3. Confirm the added versions are listed by Supabase migration history"
            echo "    4. Add to PR description: <!-- migration-applied-to-prod -->"
            echo "    5. Re-run this check (push a new commit or re-run the workflow)"
            echo ""
            exit 1
          fi

          echo "✓ Production migration versions and PR evidence marker found — check passes."
