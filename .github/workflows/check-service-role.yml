name: Check Service-Role Usage

on:
  pull_request:
    paths:
      - "backend/app/routers/**"
      - "scripts/check-service-role-usage.sh"
      - "scripts/check_service_role_usage.py"
      - "scripts/guard_tests/check_service_role_usage.py"
      - ".github/workflows/check-service-role.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/routers/**"
      - "scripts/check-service-role-usage.sh"
      - "scripts/check_service_role_usage.py"
      - "scripts/guard_tests/check_service_role_usage.py"
      - ".github/workflows/check-service-role.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify no new service-role usage in routers
        env:
          SERVICE_ROLE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SERVICE_ROLE_HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          SERVICE_ROLE_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check-service-role-usage.sh
      - name: Test service-role guard
        run: python3 -m unittest scripts.guard_tests.check_service_role_usage
